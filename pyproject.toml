[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-deleted-watcher"
version = "0.1.7"
description = "Уведомления об удалённых постах в Telegram-каналах"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["telethon>=1.36", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
tg-watcher = "watcher.__main__:main"

[tool.setuptools]
packages = ["watcher"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
